<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금융 계산 모바일 와이어프레임 ver.0.2</title>
<style>
:root{--ink:#252525;--mid:#777;--line:#d8d8d8;--soft:#f1f1f1;--paper:#fff;--dark:#444;--pale:#fafafa}
*{box-sizing:border-box}
body{margin:0;background:#e9e9e9;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}
header{padding:28px 34px 18px;background:#f7f7f7;border-bottom:1px solid #d5d5d5}
h1{font-size:24px;margin:0 0 7px;font-weight:800}
header p{margin:0;color:#666;font-size:13px;line-height:1.6}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.legend span{font-size:11px;padding:5px 9px;border:1px solid #ccc;border-radius:20px;background:#fff;color:#555}
.board{padding:28px;display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:26px;align-items:start}
figure{margin:0;min-width:0}
figcaption{font-size:13px;font-weight:700;color:#444;margin:0 0 9px 3px}
.device{width:100%;max-width:310px;margin:auto;background:#fff;border:1px solid #bdbdbd;border-radius:27px;padding:0 15px 14px;box-shadow:0 5px 18px #00000012;min-height:625px;position:relative;overflow:hidden}
.status{height:29px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;padding:0 3px}
.status .sys{letter-spacing:2px}
.appbar{height:43px;display:flex;align-items:center;justify-content:center;position:relative;font-size:17px;font-weight:800;border-bottom:1px solid #eee}
.back{position:absolute;left:1px;font-size:20px;color:#555}
.content{padding:14px 1px 58px}
.eyebrow{font-size:10px;color:#888;letter-spacing:.3px;margin-bottom:6px}
.heading{font-size:21px;font-weight:800;line-height:1.3;margin:2px 0 6px}
.sub{font-size:11px;color:#777;line-height:1.5;margin-bottom:15px}
.section{font-size:13px;font-weight:800;margin:15px 0 8px}
.card{background:#f5f5f5;border:1px solid #e5e5e5;border-radius:13px;padding:12px;margin:8px 0}
.choice{display:flex;align-items:center;gap:11px;background:#f4f4f4;border:1px solid #ddd;border-radius:13px;padding:14px;margin:9px 0}
.symbol{width:36px;height:36px;border-radius:10px;background:#ddd;display:grid;place-items:center;color:#555;font-size:18px;font-weight:800;flex:none}
.choice b{font-size:13px}.choice small{display:block;color:#888;font-size:10px;margin-top:3px}
.chev{margin-left:auto;color:#777;font-size:20px}
.field{margin:11px 0}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:#555}
.value{height:38px;border:1px solid #ccc;border-radius:9px;background:#fff;padding:10px;font-size:12px;display:flex;align-items:center;justify-content:space-between;color:#333}
.hint{background:#eee;border-radius:9px;padding:9px;font-size:10px;line-height:1.5;color:#666;margin:12px 0}
.btn{background:#454545;color:#fff;border-radius:9px;text-align:center;padding:12px 8px;font-size:12px;font-weight:700;margin:13px 0 8px}
.btn.light{background:#fff;color:#444;border:1px solid #aaa}
.btnrow{display:flex;gap:7px}.btnrow .btn{flex:1}
.step{display:flex;align-items:center;gap:7px;font-size:10px;color:#888;margin:6px 0 15px}
.dot{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#444;color:white;font-size:10px}
.dot.off{background:#ddd;color:#777}
.line{height:1px;background:#ccc;flex:1}
.kpi{background:#f1f1f1;border:1px solid #e2e2e2;border-radius:13px;padding:15px;text-align:center}
.kpi small{font-size:10px;color:#777}.kpi strong{display:block;font-size:22px;margin:6px 0}
.rows{font-size:11px}.rows div{display:flex;justify-content:space-between;padding:7px 1px;border-bottom:1px solid #eee}.rows span:first-child{color:#777}
.pillrow{display:flex;gap:5px;margin:10px 0}.pill{font-size:10px;padding:7px 9px;border-radius:20px;background:#eee;color:#666}.pill.active{background:#444;color:#fff}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:7px}.compare .card{text-align:center;padding:10px 6px;margin:5px 0}.compare b{display:block;font-size:13px;margin:6px 0}.compare small{font-size:9px;color:#777}
.barset{height:95px;display:flex;align-items:end;justify-content:space-around;border-bottom:1px solid #bbb;margin:12px 4px 5px}
.bar{width:45px;background:#aaa;border-radius:5px 5px 0 0;position:relative}.bar.dark{background:#555}.bar span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:9px}
.nav{position:absolute;bottom:11px;left:15px;right:15px;border-top:1px solid #e5e5e5;padding-top:9px;display:flex;justify-content:space-around;color:#777;font-size:10px}
.nav b{color:#333}
.record{display:flex;align-items:center;gap:9px;padding:11px;background:#f4f4f4;border:1px solid #e5e5e5;border-radius:11px;margin:8px 0}
.record .meta{font-size:10px;color:#777}.record strong{display:block;font-size:12px;color:#333;margin-top:3px}
.record .more{margin-left:auto;color:#777;font-size:17px}
.notice{font-size:9px;color:#777;line-height:1.5;margin:12px 2px}
.empty{border:1px dashed #bbb;border-radius:12px;text-align:center;padding:25px 10px;color:#888;font-size:11px;line-height:1.7;margin-top:25px}
@media(max-width:1100px){.board{grid-template-columns:repeat(3,minmax(220px,1fr))}}
@media(max-width:760px){header{padding:20px}.board{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px;gap:18px}.device{min-height:610px;padding-left:11px;padding-right:11px}.heading{font-size:18px}}
@media(max-width:480px){.board{grid-template-columns:1fr}.device{max-width:340px;min-height:640px}}
@media print{body{background:#fff}.board{grid-template-columns:repeat(4,1fr);gap:12px;padding:12px}header{padding:15px}.device{box-shadow:none;min-height:600px}}
</style>
</head>
<body>
<header>
  <h1>금융 계산 모바일 와이어프레임 <span style="color:#777">ver.0.2</span></h1>
  <p>PRD v0.1 기반 · Android 스마트폰 세로 화면 · 전체 기능 정적 미리보기<br>실제 앱의 화면 흐름을 한 장의 보드에서 확인할 수 있도록 구성한 시안입니다. 화면 내 요소는 클릭되지 않습니다.</p>
  <div class="legend"><span>그레이톤 UI</span><span>Android 모바일 전용</span><span>S-01 조건 입력</span><span>S-02 결과·비교</span><span>S-03 기록 관리</span></div>
</header>
<main class="board">
<figure><figcaption>01 / 홈 · 금융 유형 선택</figcaption><section class="device">
<div class="status"><span>9:41</span><span class="sys">▮ ▴ ▰</span></div>
<div class="content">
<div class="eyebrow">MY FINANCE TOOL</div><div class="heading">금융 계산</div><div class="sub">내 조건으로 예상 금액을 계산하고<br>여러 조건을 한눈에 비교해 보세요.</div>
<div class="section">어떤 계산을 할까요?</div>
<div class="choice"><div class="symbol">₩</div><div><b>예금 계산</b><small>목돈을 맡겼을 때 예상 금액</small></div><span class="chev">›</span></div>
<div class="choice"><div class="symbol">▦</div><div><b>적금 계산</b><small>매월 저축했을 때 예상 금액</small></div><span class="chev">›</span></div>
<div class="choice"><div class="symbol">↗</div><div><b>대출 계산</b><small>원리금 및 월 상환액 확인</small></div><span class="chev">›</span></div>
<div class="section">최근 계산</div>
<div class="record"><div class="symbol">₩</div><div><div class="meta">예금 · 11.03</div><strong>10,296,100원</strong></div><span class="more">›</span></div>
<div class="record"><div class="symbol">▦</div><div><div class="meta">적금 · 11.02</div><strong>3,648,900원</strong></div><span class="more">›</span></div>
</div><div class="nav"><b>⌂ 계산</b><span>◷ 기록</span></div>
</section></figure>

<figure><figcaption>02 / S-01 · 예금 조건 입력</figcaption><section class="device">

<figure><figcaption>03 / S-01 · 적금 조건 입력</figcaption><section class="device">
